<!DOCTYPE html>
<html>

<head>
    <title>Bank App Part 1</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            padding-top: 50px;
        }

        .box {
            background: white;
            padding: 20px;
            width: 300px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 8px;
            margin: 5px;
            width: 90%;
        }

        button {
            padding: 10px;
            width: 95%;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        h3 {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Bank App - Part 1</h2>

        <label>Income:</label><br>
        <input type="number" id="income"><br>

        <label>Expense:</label><br>
        <input type="number" id="expense"><br>

        <button onclick="calculate()">Calculate Balance</button>

        <h3 id="result"></h3>

    </div>

    <script>
        function calculate() {
            let income = document.getElementById("income").value;
            let expense = document.getElementById("expense").value;

            let balance = income - expense;

            document.getElementById("result").innerHTML = "Balance: " + balance;
        }
    </script>

</body>

</html>
