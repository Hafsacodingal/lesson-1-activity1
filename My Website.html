<!DOCTYPE html>
<html>

<head>  
    <title>My Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Navigation bar */
        .navbar {
            background-color: black;
            color: white;
            padding: 10px;
            text-align: center;
        }

        .navbar a {
            color: white;
            margin: 10px;
            text-decoration: none;
        }

        /* Banner */
        .banner {
            background-color: lightblue;
            height: 200px;
            text-align: center;
            padding-top: 80px;
            font-size: 24px;
        }

        /* Content */
        .content {
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>

    <div class="banner">
        Welcome to My Website
    </div>

    <div class="content">
        <p>This is my first website layout.</p>
    </div>

</body>

</html>
