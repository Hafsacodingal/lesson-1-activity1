<!DOCTYPE html>
<html>

<head>
    <title id="myTitle">My Web Page</title>
</head>

<body>

    <h2>DOM Example</h2>

    <button onclick="showText()">Click Me</button>

    <p id="para1"></p>
    <p id="para2"></p>

    <script>
        function showText() {
            let titleText = document.title;

            document.getElementById("para1").innerHTML = titleText;
            document.getElementById("para2").innerHTML = titleText;
        }
    </script>

</body>

</html>
