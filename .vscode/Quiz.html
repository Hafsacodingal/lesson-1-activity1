<!DOCTYPE html>
<html>

<head>
    <title>Quiz</title>
    <style>
        body {

            font-family: Arial, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            background: #eef2f3;

        }

        .quiz-container {

            background: white;

            border-radius: 8px;

            padding: 20px 40px;

            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);

            width: 400px;

            text-align: center;

        }

        .quiz-container h2 {

            margin-bottom: 20px;

        }

        .question {

            font-size: 18px;

            margin-bottom: 15px;

        }

        .options {

            list-style-type: none;

            padding: 0;

        }

        .options li {

            margin: 8px 0;

        }

        .options button {

            width: 100%;

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 4px;

            background: #f7f7f7;

            cursor: pointer;

            transition: background 0.3s;

        }

        .options button:hover {

            background: #d0e6ff;

        }

        #next-btn {

            margin-top: 15px;

            padding: 10px 20px;

            border: none;

            background: #007bff;

            color: white;

            border-radius: 4px;

            cursor: pointer;

            display: none;

        }

        #next-btn:hover {

            background: #0056b3;

        }
    </style>
</head>

<body>
    <div class="quiz-container">
        <h2>Quick Quiz</h2>
        <div id="quiz">
            <p id="question" class="question"></p>
            <ul id="options" class="options"></ul>
            <button id="next-btn">Next</button>
        </div>
    </div>
    <script>
        const quizData = [
            {
                question: "Which language runs in a web browser?",
                options: ["Python", "C", "Java", "JavaScript"],
                correct: "JavaScript"
            },
            {
                question: "What does CSS stand for?",
                options: ["Creative Style Sheets", "Cascading Style Sheets", "Computer Style System", "Colorful Style Sheets"],
                correct: "Cascading Style Sheets"
            },
            {
                question: "What year was HTML first released?",
                options: ["1991", "1989", "1995", "2000"],
                correct: "1991"
            }
        ];
        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const nextBtn = document.getElementById('next-btn');
        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {
            nextBtn.style.display = 'none';
            const q = quizData[currentQuestion];
            questionEl.textContent = q.question;
            optionsEl.innerHTML = '';
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.textContent = opt;
                btn.addEventListener('click', selectAnswer);
                const li = document.createElement('li');
                li.appendChild(btn);
                optionsEl.appendChild(li);
            });
        }
        function selectAnswer(e) {

            const selected = e.target.textContent;

            const correct = quizData[currentQuestion].correct;

            if (selected === correct) {

                e.target.style.backgroundColor = '#9cff9c';

                score++;

            } else {

                e.target.style.backgroundColor = '#ff9c9c';

            }

            Array.from(optionsEl.querySelectorAll('button')).forEach(btn => btn.disabled = true);

            nextBtn.style.display = 'inline-block';

        }

        nextBtn.addEventListener('click', () => {

            currentQuestion++;

            if (currentQuestion < quizData.length) {

                showQuestion();

            } else {

                showScore();

            }

        });

        function showScore() {

            questionEl.textContent = `You scored ${score} out of ${quizData.length}! 🎉`;

            optionsEl.innerHTML = '';

            nextBtn.style.display = 'none';

        }
    </script>
</body>

</html>
