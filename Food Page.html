<!DOCTYPE html>
<html>

<head>
    <title>Food Page Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
        }

        /* Top bar */
        .topbar {
            background: deeppink;
            color: white;
            padding: 10px;
            text-align: center;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            padding: 15px;
            background: white;
        }

        .search {
            width: 300px;
            padding: 8px;
        }

        /* Layout */
        .container {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 200px;
            padding: 15px;
            border-right: 1px solid #ccc;
        }

        /* Main content */
        .main {
            flex: 1;
            padding: 15px;
        }

        /* Food items */
        .items {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .card {
            width: 120px;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 80px;
            object-fit: cover;
        }
        .navigation img{
            width: 25px;
        
        }
        a{
            color: black;
        }
        .navigation a{
        margin-right: 30px;
        }
        .navigation{
            border-bottom: 1px solid #ccc;
        }
        .banner img{
            margin-left: 800px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        Sign up for free delivery
    </div>

    <div class="header">
        <div>
        <img src="https://cdn.worldvectorlogo.com/logos/foodpanda-logo.svg" width="200px">
        </div>
        <input class="search" type="text" placeholder="Search food...">
        <div>Login</div>
    </div>
    <div class="navigation">        
                <img src="motorbike.png"><a href=""><b>Delivery</b></a>
                <img src="Delivery-man.png"><a href=""><b>Pickup</b></a>
                <img src="parcel.png"><a href=""><b>Pandamart</b></a>
                <img src="store.png"><a href=""><b>Shops</b></a>
    </div>
    <div class="container">

        <div class="sidebar">
            <h4>Filters</h4>
            <p>Relevance</p>
            <p>Fastest delivery</p>
            <p>Top rated</p>
        </div>

        <div class="main">
            <div class="banner">
                <h1>Sign up for free delivery on your first order and <br>enjoy delicious everywhere</h1>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTE9tBwFS5bDpcNsp8UlDNHnN3fg2WgJsmK8A&s">
            </div>

            <h2>Cuisines</h2>

            <div class="items">

                <div class="card">
                    <img src="https://e7.pngegg.com/pngimages/544/160/png-clipart-pizza-hut-restaurant-pizza-delivery-pizza-food-cheese-thumbnail.png" />
                    <p>Pizza</p>
                </div>

                <div class="card">
                    <img src="https://i0.wp.com/binjalsvegkitchen.com/wp-content/uploads/2025/05/Veg-Kofta-Biryani-H1.jpg?fit=600%2C900&ssl=1" />
                    <p>Biryani</p>
                </div>

                <div class="card">
                    <img src="https://www.savingdessert.com/wp-content/uploads/2016/06/Marinated-Burgers-5.jpg" />
                    <p>Burgers</p>
                </div>

                <div class="card">
                    <img src="https://www.bhg.com/thmb/5kDgr3hzc5fYHQGHYBwr0zhCtsA=/4085x0/filters:no_upscale():strip_icc()/R277194_BP_1345_preview-a15528443e23455f8bc21cae06fd4020.jpg" />
                    <p>Ice Cream</p>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
