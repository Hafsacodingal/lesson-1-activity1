<!DOCTYPE html>
<html>

<head>
    <title>string Methode</title>
</head>

<body>
    <h1>The Javescript string Methode </h1>
    <p id="string"></p>
    <p id="number"></p>
    <script>
        var x = 60;
        var y = 76;
        document.getElementById("number").innerHTML = x + y;
        document.getElementById("string").innerHTML = String(x) + String(y);

    </script>
</body>

</html>
