<!DOCTYPE html>
<html>

<head>
    <title>Bank App Part 2</title>

    <style>
        body {
            font-family: Arial;
            background-color: #eef2f3;
            text-align: center;
            padding-top: 40px;
        }

        .box {
            background: white;
            width: 320px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input {
            padding: 8px;
            width: 90%;
            margin: 10px 0;
        }

        button {
            padding: 10px;
            width: 45%;
            margin: 5px;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .income {
            background-color: green;
        }

        .expense {
            background-color: red;
        }

        ul {
            text-align: left;
            padding-left: 20px;
        }

        h3 {
            color: blue;
        }
    </style>
</head>

<body>

    <div class="box">

        <h2>Bank App - Part 2</h2>

        <input type="number" id="amount" placeholder="Enter amount"><br>

        <button class="income" onclick="addIncome()">Income</button>
        <button class="expense" onclick="addExpense()">Expense</button>

        <h3 id="balance">Balance: 0</h3>

        <h4>Transactions</h4>
        <ul id="list"></ul>

    </div>

    <script>
        let balance = 0;

        function addIncome() {
            let amount = document.getElementById("amount").value;
            balance += Number(amount);

            document.getElementById("balance").innerHTML = "Balance: " + balance;

            let li = document.createElement("li");
            li.innerHTML = "Income: " + amount;
            document.getElementById("list").appendChild(li);
        }

        function addExpense() {
            let amount = document.getElementById("amount").value;
            balance -= Number(amount);

            document.getElementById("balance").innerHTML = "Balance: " + balance;

            let li = document.createElement("li");
            li.innerHTML = "Expense: " + amount;
            document.getElementById("list").appendChild(li);
        }
    </script>

</body>

</html>
